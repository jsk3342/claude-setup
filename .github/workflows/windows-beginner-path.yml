name: Windows beginner path

# 초보가 실제로 밟는 경로: 관리자 PowerShell + Node·Python·Git·Scoop 없음 + README 명령 그대로.
# 백신 잠금(EBUSY)은 호스티드 러너에서 재현되지 않는다.

on:
  workflow_dispatch:
  push:
    branches:
      - "verify/**"

permissions:
  contents: read

jobs:
  beginner-path:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the matching test code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Seed user settings that the installer must preserve
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $profilePath = $PROFILE.CurrentUserCurrentHost
          $terminalPath = Join-Path $env:LOCALAPPDATA 'Microsoft\Windows Terminal\settings.json'
          foreach ($path in @($profilePath, $terminalPath)) {
              New-Item -ItemType Directory -Force -Path (Split-Path $path -Parent) | Out-Null
          }
          Set-Content -LiteralPath $profilePath -Value '# Existing user profile: preserve this file' -Encoding UTF8
          Set-Content -LiteralPath $terminalPath -Value '{"theme":"dark","profiles":{"defaults":{"font":{"size":17}}}}' -Encoding UTF8
          $hashes = @{}
          foreach ($path in @($profilePath, $terminalPath)) { $hashes[$path] = (Get-FileHash -LiteralPath $path).Hash }
          $hashes | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP\settings-before.json" -Encoding UTF8

      - name: Hide preinstalled Node, Python and Git
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tools = @("node.exe", "python.exe", "python3.exe", "git.exe", "scoop.cmd", "scoop.ps1")
          foreach ($scope in @("Machine", "User")) {
              $entries = @([System.Environment]::GetEnvironmentVariable("PATH", $scope) -split ";" | Where-Object { $_ })
              $kept = @($entries | Where-Object {
                  $entry = $_
                  -not ($tools | Where-Object { Test-Path -LiteralPath (Join-Path $entry $_) })
              })
              [System.Environment]::SetEnvironmentVariable("PATH", ($kept -join ";"), $scope)
              Write-Host "$scope PATH: removed $($entries.Count - $kept.Count) entries"
          }

      - name: Run README command as administrator
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $isAdmin) { throw "Runner is not elevated; this test needs an administrator PowerShell." }

          # Scoop 설치기는 CI에서만 관리자 거부를 건너뛴다. 실제 사용자 PC처럼 막는다.
          Remove-Item Env:CI -ErrorAction SilentlyContinue

          # 새 PowerShell 창처럼 저장된 PATH만으로 시작한다.
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "User") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "Machine")
          foreach ($tool in @("node", "git", "scoop")) {
              if (Get-Command $tool -ErrorAction SilentlyContinue) { throw "$tool is still visible before install." }
          }

          $env:CLAUDE_SETUP_REF = $env:GITHUB_SHA
          $installerUrl = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install.ps1"
          irm $installerUrl | iex

      - name: Rerun installer skips everything
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "User") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "Machine")
          $env:CLAUDE_SETUP_REF = $env:GITHUB_SHA
          $installerUrl = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install.ps1"
          irm $installerUrl | iex

      - name: Verify a new PowerShell sees every tool
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "User") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "Machine")
          foreach ($tool in @("scoop", "node", "python", "git", "claude")) {
              $command = Get-Command $tool -ErrorAction Stop
              Write-Host "$tool -> $($command.Source)"
          }
          node -v
          python --version
          git --version
          $claude = (& claude --version 2>&1) -join ""
          if ($LASTEXITCODE -ne 0 -or $claude -notmatch '\(Claude Code\)') { throw "claude --version failed: $claude" }
          Write-Host $claude

      - name: Verify usage mode on real Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "User") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "Machine")
          node --test tests/usage-mode.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Usage mode Windows tests failed." }
          if (!(Get-Command wt.exe -ErrorAction SilentlyContinue)) { throw "Windows Terminal is unavailable." }
          $settingsPath = Join-Path $env:USERPROFILE '.claude\settings.json'
          $settings = Get-Content $settingsPath -Raw | ConvertFrom-Json
          if ($settings.statusLine.command -notmatch 'usage-line.mjs') { throw "Usage mode was not connected." }
          $hashes = Get-Content "$env:RUNNER_TEMP\settings-before.json" -Raw | ConvertFrom-Json
          foreach ($item in $hashes.PSObject.Properties) {
              if ((Get-FileHash -LiteralPath $item.Name).Hash -ne $item.Value) { throw "User settings changed: $($item.Name)" }
          }

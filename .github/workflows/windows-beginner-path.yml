name: Windows beginner path

# 초보가 실제로 밟는 경로: 관리자 PowerShell + Node·Python·Git·Scoop 없음 + README 명령 그대로.
# 백신 잠금(EBUSY)은 호스티드 러너에서 재현되지 않는다.

on:
  workflow_dispatch:
  push:
    branches:
      - "verify/**"

permissions:
  contents: read

jobs:
  beginner-path:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Hide preinstalled Node, Python and Git
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tools = @("node.exe", "python.exe", "python3.exe", "git.exe", "scoop.cmd", "scoop.ps1")
          foreach ($scope in @("Machine", "User")) {
              $entries = @([System.Environment]::GetEnvironmentVariable("PATH", $scope) -split ";" | Where-Object { $_ })
              $kept = @($entries | Where-Object {
                  $entry = $_
                  -not ($tools | Where-Object { Test-Path -LiteralPath (Join-Path $entry $_) })
              })
              [System.Environment]::SetEnvironmentVariable("PATH", ($kept -join ";"), $scope)
              Write-Host "$scope PATH: removed $($entries.Count - $kept.Count) entries"
          }

      - name: Run README command as administrator
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $isAdmin) { throw "Runner is not elevated; this test needs an administrator PowerShell." }

          # Scoop 설치기는 CI에서만 관리자 거부를 건너뛴다. 실제 사용자 PC처럼 막는다.
          Remove-Item Env:CI -ErrorAction SilentlyContinue

          # 새 PowerShell 창처럼 저장된 PATH만으로 시작한다.
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "User") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "Machine")
          foreach ($tool in @("node", "git", "scoop")) {
              if (Get-Command $tool -ErrorAction SilentlyContinue) { throw "$tool is still visible before install." }
          }

          $installerUrl = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install.ps1"
          irm $installerUrl | iex

      - name: Rerun installer skips everything
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "User") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "Machine")
          $installerUrl = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install.ps1"
          irm $installerUrl | iex

      - name: Verify a new PowerShell sees every tool
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "User") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "Machine")
          foreach ($tool in @("scoop", "node", "python", "git", "claude")) {
              $command = Get-Command $tool -ErrorAction Stop
              Write-Host "$tool -> $($command.Source)"
          }
          node -v
          python --version
          git --version
          $claude = (& claude --version 2>&1) -join ""
          if ($LASTEXITCODE -ne 0 -or $claude -notmatch '\(Claude Code\)') { throw "claude --version failed: $claude" }
          Write-Host $claude
